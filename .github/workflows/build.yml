name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils wget

      - name: Cache ARM GCC toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /home/runner/arm-gcc-toolchain
          key: arm-gcc-13.3.rel1

      - name: Install ARM GCC toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/arm-gcc-toolchain
          wget -qO- "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJf - -C /home/runner/arm-gcc-toolchain --strip=1

      - name: Add toolchain to PATH
        run: echo "/home/runner/arm-gcc-toolchain/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          echo "## Minimal make test" >> $GITHUB_STEP_SUMMARY
          echo 'all:' > /tmp/test.mk
          echo '	@echo hello' >> /tmp/test.mk
          make -f /tmp/test.mk all >> $GITHUB_STEP_SUMMARY 2>&1
          echo "make -f test: OK" >> $GITHUB_STEP_SUMMARY
          echo "## make -p (print db)" >> $GITHUB_STEP_SUMMARY
          make -p all 2>&1 | head -30 >> $GITHUB_STEP_SUMMARY || echo "Exit: $?" >> $GITHUB_STEP_SUMMARY
