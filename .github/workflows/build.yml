name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils wget

      - name: Cache ARM GCC toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /home/runner/arm-gcc-toolchain
          key: arm-gcc-13.3.rel1

      - name: Install ARM GCC toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/arm-gcc-toolchain
          wget -qO- "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJf - -C /home/runner/arm-gcc-toolchain --strip=1

      - name: Add toolchain to PATH
        run: echo "/home/runner/arm-gcc-toolchain/bin" >> $GITHUB_PATH

      - name: Test deps
        run: |
          echo "=== make deps ===" > debug1.log
          make deps >> debug1.log 2>&1 || echo "DEPS EXIT: $?" >> debug1.log
          echo "=== ls CMSIS dirs ===" >> debug1.log
          ls -la CMSIS/core CMSIS/device >> debug1.log 2>&1 || echo "dirs not found" >> debug1.log
        shell: bash
      - name: Test compile (debug make)
        run: |
          make -d all > debug2_full.log 2>&1; rc=$?
          echo "MAKE EXIT: $rc" >> debug2_full.log
          { head -n 80 debug2_full.log; echo "..."; tail -n 80 debug2_full.log; } > debug2.log
        shell: bash
      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: "debug*.log"
